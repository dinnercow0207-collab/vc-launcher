<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCランチャー Pro (God Auth)</title>
    <style>
        body{font-family:sans-serif;text-align:center;margin:0;padding-bottom:20px;-webkit-text-size-adjust:100%;min-height:100vh;background:#1e1f22;color:#fff}
        body.theme-line{background:#7493c0;color:#333}
        body.theme-cyber{background:#0d0e15;color:#00ffcc}
        body.theme-black{background:#000;color:#fff}
        body.anim-on,body.anim-on *{transition:all .2s ease}
        h1{margin-top:20px;font-size:24px;cursor:pointer;user-select:none;-webkit-user-select:none}
        .theme-cyber h1{text-shadow:0 0 8px #00ffcc}
        
        .auth-container, .user-box{background:#2b2d31;width:340px;margin:20px auto;padding:20px;border-radius:12px;border:2px dashed #5865f2;box-sizing:border-box}
        .theme-line .auth-container, .theme-line .user-box{background:#fff;border-color:#24a55a}
        .theme-cyber .auth-container, .theme-cyber .user-box{background:#161925;border-color:#00ffcc}
        .theme-black .auth-container, .theme-black .user-box{background:#111;border-color:#fff}

        input{display:block;margin:8px auto;padding:10px;width:220px;border-radius:8px;border:none;outline:none;font-size:16px;background:#2b2d31;color:#fff}
        .theme-line input{background:#fff;color:#333;border:1px solid #ccc}
        .theme-cyber input{background:#161925;color:#00ffcc;border:1px solid #00ffcc;box-shadow:0 0 5px #00ffcc}
        .theme-black input{background:#1a1a1a;color:white;border:1px solid #333}
        
        button,.room-card a, .room-card button.joinBtn{margin:5px;padding:10px 14px;border-radius:8px;border:none;color:white;cursor:pointer;-webkit-tap-highlight-color:transparent;font-size:13px;font-weight:bold}
        #addBtn, .btn-primary, #inviteBtn, #sendMsgBtn{background:#5865f2}
        .theme-line #addBtn, .theme-line .btn-primary, .theme-line #inviteBtn, .theme-line #sendMsgBtn{background:#24a55a}
        .theme-cyber #addBtn, .theme-cyber .btn-primary, .theme-cyber #inviteBtn, .theme-cyber #sendMsgBtn{background:#ff007f;box-shadow:0 0 8px #ff007f}
        .theme-black #addBtn, .theme-black .btn-primary, .theme-black #inviteBtn, .theme-black #sendMsgBtn{background:#fff;color:black}
        
        #leaveBtn, .btn-danger{background:#ed4245}

        .room-card{width:340px;margin:12px auto;padding:14px;border-radius:12px;background:#2b2d31;box-sizing:border-box;text-align:left}
        .theme-line .room-card{background:#fff;border:1px solid #e2e8f0;box-shadow:0 2px 4px rgba(0,0,0,.05)}
        .theme-cyber .room-card{background:#161925;border:1px solid #00ffcc;box-shadow:0 0 8px rgba(0,255,204,.3)}
        .theme-black .room-card{background:#111;border:1px solid #333}
        
        .room-header{display:flex;justify-content:space-between;align-items:center}
        .room-name{font-weight:bold;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;margin-right:5px}
        
        .room-controls{display:flex;align-items:center}
        .room-card button.joinBtn{background:#5865f2;padding:8px 14px;}
        .theme-line .room-card button.joinBtn{background:#24a55a}
        .theme-cyber .room-card button.joinBtn{background:#00ffcc;color:#0d0e15}
        .theme-black .room-card button.joinBtn{background:#fff;color:#000}
        
        .admin-only-btn { display: none; }
        .admin-mode .admin-only-btn { display: inline-block; }
        .admin-only-block { display: none; }
        .admin-mode .admin-only-block { display: block; }
        
        .ban-btn { display: none; background: #ed4245; color: white; padding: 2px 5px; font-size: 9px; border-radius: 4px; margin-left: 4px; vertical-align: middle; }
        .admin-mode .ban-btn { display: inline-block; }

        .room-card button.delBtn{background:#ed4245;padding:8px 14px;margin-left:4px}
        .room-card button.copyBtn{background:#4f545c;padding:8px 10px}
        .room-card button.moveBtn{background:#35373c;padding:8px 6px;font-size:11px}

        .member-list{margin-top:10px;padding-top:8px;border-top:1px solid #3f4147;display:flex;flex-wrap:wrap;gap:6px}
        .user-tag{background:#35373c;color:#dbdee1;padding:4px 8px;border-radius:12px;font-size:12px;font-weight:bold;display:inline-flex;align-items:center}
        .user-tag::before{content:"🔊";margin-right:4px;font-size:10px}

        .chat-container{width:340px;margin:20px auto;background:#2b2d31;border-radius:12px;padding:14px;box-sizing:border-box;text-align:left}
        .theme-line .chat-container{background:#fff;border:1px solid #e2e8f0}
        .theme-cyber .chat-container{background:#161925;border:1px solid #00ffcc;box-shadow:0 0 8px rgba(0,255,204,.3)}
        .theme-black .chat-container{background:#111;border:1px solid #333}
        
        .chat-logs{height:180px;overflow-y:auto;background:#1e1f22;padding:10px;border-radius:8px;margin-bottom:10px;font-size:13px}
        .theme-line .chat-logs{background:#f8fafc;color:#333}
        .theme-cyber .chat-logs{background:#0d0e15;color:#00ffcc}
        .theme-black .chat-logs{background:#000}
        
        .chat-msg{margin-bottom:8px;word-break:break-all;line-height:1.4}
        .chat-msg .uname{font-weight:bold;color:#5865f2;margin-right:6px}
        .theme-line .chat-msg .uname{color:#24a55a}
        .theme-cyber .chat-msg .uname{color:#ff007f}
        
        .chat-input-row{display:flex;gap:6px;align-items:center}
        #msgInput{flex:1;margin:0;padding:8px;font-size:14px}

        #settingsModal{display:none;background:rgba(0,0,0,.85);max-width:300px;margin:15px auto;padding:15px;border-radius:12px;text-align:left;color:white}
        .setting-row{margin:12px 0;display:flex;justify-content:space-between;align-items:center;font-size:14px}
        #settingsModal select{padding:6px;border-radius:6px;background:#40444b;color:white;border:none}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#23a55a;color:white;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:bold;display:none;z-index:1000}
        .main-content{display:none}
    </style>
</head>
<body class="theme-discord anim-on">

    <h1 id="titleBtn">VCランチャー Pro</h1>

    <!-- 🔑 ログイン・アカウント作成画面 -->
    <div id="authArea" class="auth-container">
        <h3 id="authTitle" style="margin-top:0;">🔐 ログイン / アカウント作成</h3>
        <input id="authUsername" placeholder="ニックネーム">
        <input id="authPassword" type="password" placeholder="パスワード">
        <input id="godPassword" type="password" placeholder="👑 神パスワード（空欄なら一般）" style="border: 1px dashed #ff007f;">
        <div style="margin-top:10px;">
            <button id="loginBtn" class="btn-primary">ログイン</button>
            <button id="registerBtn" style="background:#24a55a;">アカウント作成</button>
        </div>
    </div>

    <!-- 🌐 メイン画面（ログイン後に表示） -->
    <div id="mainArea" class="main-content">
        <div class="user-box">
            <span style="font-size:13px; font-weight:bold;">👤 ログイン中: <span id="currentUserName" style="color:#5865f2; font-size:16px;"></span> <span id="roleBadge" style="font-size:11px; background:#4f545c; padding:2px 6px; border-radius:4px; margin-left:4px;">メンバー</span></span>
            <div style="margin-top:8px;">
                <button id="inviteBtn">✉️ 友達をこのサイトに招待</button><br>
                <button id="leaveBtn" style="margin-top:5px;">🔊 全ての部屋から退室</button>
                <button id="logoutBtn" class="btn-danger" style="padding:6px 10px; font-size:11px; margin-top:5px;">ログアウト</button>
            </div>
        </div>

        <div id="settingsModal">
            <h3>⚙️ 隠し設定</h3>
            <div class="setting-row">
                <span>テーマ:</span>
                <select id="themeSelect">
                    <option value="discord">Discord風</option>
                    <option value="line">LINE風</option>
                    <option value="cyber">サイバーポップ</option>
                    <option value="black">漆黒</option>
                </select>
            </div>
            <div class="setting-row">
                <span>アニメ:</span>
                <label><input type="checkbox" id="animToggle" style="display:inline;width:auto;">有効</label>
            </div>
        </div>

        <!-- 👑 管理者（神）専用：部屋追加パネル -->
        <div class="admin-only-block" style="margin-bottom: 15px;">
            <input id="name" placeholder="部屋名">
            <input id="url" placeholder="通話用リンク（URL）">
            <button id="addBtn">＋部屋を追加</button>
        </div>

        <!-- ボイスチャット部屋リスト -->
        <div id="list"></div>

        <!-- 💬 リアルタイムテキストチャットエリア -->
        <div class="chat-container">
            <span style="font-size:13px; font-weight:bold; display:block; margin-bottom:6px;">💬 全体テキストチャット</span>
            <div class="chat-logs" id="chatLogs"></div>
            <div class="chat-input-row">
                <input id="msgInput" placeholder="メッセージを入力...">
                <button id="sendMsgBtn" style="padding:8px 12px; margin:0;">送信</button>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast">コピーしました</div>

    <!-- Firebase部品 -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        const GOD_SECRET_KEY = "god1234"; 

        const firebaseConfig = {
            apiKey: "AIzaSyCM0V4BEiAyD8qmTuVAZ8-cv-WcXg8yQ5U",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "vc-32606",
            storageBucket: "vc-32606.firebasestorage.app",
            messagingSenderId: "573187511420",
            appId: "1:573187511420:web:edd86673afacadb80a25f9",
            measurementId: "G-7C14Y7TJJF"
        };

        firebase.initializeApp(firebaseConfig);
        const dbRooms = firebase.database().ref("rooms_invite_code_v3");
        const dbUsers = firebase.database().ref("users_auth");
        const dbChat  = firebase.database().ref("chat_logs");
        const dbBans  = firebase.database().ref("ban_list");

        let rooms = [], config = {theme: "discord", anim: true};
        let loginUser = null;
        let isGodMode = false;

        try { config = JSON.parse(localStorage.getItem("vc_launcher_config") || '{"theme":"discord","anim":true}'); } catch(e){}
        function apply() {
            document.body.className = "theme-" + config.theme + " " + (config.anim ? "anim-on" : "");
            if(isGodMode) {
                document.body.classList.add("admin-mode");
                const rb = document.getElementById("roleBadge");
                if(rb) { rb.innerText = "👑 神"; rb.style.background = "#ff007f"; }
            } else {
                document.body.classList.remove("admin-mode");
                const rb = document.getElementById("roleBadge");
                if(rb) { rb.innerText = "メンバー"; rb.style.background = "#4f545c"; }
            }
            const ts = document.getElementById("themeSelect"), at = document.getElementById("animToggle");
            if(ts) ts.value = config.theme;
            if(at) at.checked = config.anim;
        }

        function saveConfig() {
            localStorage.setItem("vc_launcher_config", JSON.stringify(config));
            apply();
        }

        function esc(s) {
            return s ? s.replace(/[&<>'"]/g, t => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[t] || t)) : "";
        }

        function showToast(t) {
            const toast = document.getElementById("toast");
            if(toast) { toast.innerText = t; toast.style.display = "block"; setTimeout(() => toast.style.display = "none", 1500); }
        }

        function checkLoginState() {
            const savedUser = localStorage.getItem("vc_launcher_loginuser");
            if(savedUser) {
                const userKey = savedUser.replace(/[.#$\[\]]/g, "_");
                dbBans.child(userKey).get().then(snapshot => {
                    if(snapshot.exists()) {
                        alert("あなたのアカウントは神によってBANされています。");
                        forceLogout();
                    } else {
                        loginUser = savedUser;
                        dbUsers.child(userKey).child("isGod").get().then(godSnap => {
                            isGodMode = godSnap.val() === true;
                            document.getElementById("authArea").style.display = "none";
                            document.getElementById("mainArea").style.display = "block";
                            document.getElementById("currentUserName").innerText = loginUser;
                            apply();
                        });
                    }
                });
            } else {
                loginUser = null; isGodMode = false;
                document.getElementById("authArea").style.display = "block";
                document.getElementById("mainArea").style.display = "none";
                apply();
            }
        }

        function forceLogout() {
            localStorage.removeItem("vc_launcher_loginuser");
            checkLoginState();
        }

        function tryJoinRoom(roomIdx) {
            if(!loginUser) return;
            const targetRoom = rooms[roomIdx];

            const inputCode = prompt("この部屋に入るための『招待コード』を入力してください：");
            if (!inputCode) return;

            if (inputCode.trim() !== targetRoom.code) {
                alert("❌ 招待コードが間違っています！");
                return;
            }

            rooms.forEach(room => { if(room.users) { Object.keys(room.users).forEach(k => { if(room.users[k] === loginUser) delete room.users[k]; }); } });
            
            if(!rooms[roomIdx].users) rooms[roomIdx].users = {};
            const uniqueKey = "u_" + loginUser.replace(/[.#$\[\]]/g, "_");
            rooms[roomIdx].users[uniqueKey] = loginUser;
            
            dbRooms.set(rooms).then(() => {
                alert("🎉 コード認証成功！通話部屋に接続します。");
                window.open(targetRoom.url, '_blank');
            });
        }
        function sendChatMessage() {
            const input = document.getElementById("msgInput");
            const text = input.value.trim();
            if(!text || !loginUser) return;
            dbChat.push({ user: loginUser, msg: text, isGod: isGodMode, time: firebase.database.ServerValue.TIMESTAMP });
            input.value = "";
        }

        function generateRandomCode() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
            let code = "";
            for (let i = 0; i < 5; i++) { code += chars.charAt(Math.floor(Math.random() * chars.length)); }
            return code;
        }

        window.onload = function() {
            checkLoginState();
            dbRooms.on("value", snapshot => { rooms = snapshot.val() || []; render(); });

            dbBans.on("value", snapshot => {
                const savedUser = localStorage.getItem("vc_launcher_loginuser");
                if(savedUser) {
                    const userKey = savedUser.replace(/[.#$\[\]]/g, "_");
                    if(snapshot.child(userKey).exists()) { alert("神によってこのサーバーからBANされました。"); forceLogout(); }
                }
            });
            dbChat.limitToLast(50).on("value", snapshot => {
                const logs = document.getElementById("chatLogs");
                if(!logs) return; logs.innerHTML = "";
                const data = snapshot.val();
                if(data) {
                    Object.keys(data).forEach(k => {
                        const m = data[k];
                        const div = document.createElement("div"); div.className = "chat-msg";
                        const showBan = isGodMode && (m.user !== loginUser) && !m.isGod;
                        div.innerHTML = `<span class="uname">${esc(m.user)}${m.isGod ? '👑' : ''}${showBan ? `<button class="ban-btn" onclick="godBanUser('${esc(m.user)}', false)">BAN</button>` : ''}:</span><span>${esc(m.msg)}</span>`;
                        logs.appendChild(div);
                    });
                    logs.scrollTop = logs.scrollHeight;
                }
            });

            document.getElementById("sendMsgBtn").onclick = sendChatMessage;
            document.getElementById("msgInput").onkeydown = e => { if(e.key === "Enter") sendChatMessage(); };

            document.getElementById("registerBtn").onclick = function() {
                const u = document.getElementById("authUsername").value.trim();
                const p = document.getElementById("authPassword").value.trim();
                const g = document.getElementById("godPassword").value.trim();
                if(!u || !p) { alert("名前とパスワードを入力してください"); return; }
                const userKey = u.replace(/[.#$\[\]]/g, "_");

                dbBans.child(userKey).get().then(banSnap => {
                    if(banSnap.exists()) { alert("このユーザー名はBANされているため作成できません"); return; }
                    dbUsers.child(userKey).get().then(snapshot => {
                        if(snapshot.exists()) { alert("そのニックネームはすでに使われています"); } 
                        else {
                            const makeMeGod = (g === GOD_SECRET_KEY);
                            dbUsers.child(userKey).set({ password: p, isGod: makeMeGod }).then(() => {
                                if(makeMeGod) { alert("👑【神アカウント】を作成しました！ログインしてください。"); }
                                else { alert("一般アカウントを作成しました！ログインしてください。"); }
                                document.getElementById("godPassword").value = "";
                            });
                        }
                    });
                });
            };

            document.getElementById("loginBtn").onclick = function() {
                const u = document.getElementById("authUsername").value.trim();
                const p = document.getElementById("authPassword").value.trim();
                if(!u || !p) return;
                const userKey = u.replace(/[.#$\[\]]/g, "_");

                dbBans.child(userKey).get().then(banSnap => {
                    if(banSnap.exists()) { alert("このアカウントはBANされています"); return; }
                    dbUsers.child(userKey).get().then(snapshot => {
                        if(snapshot.exists() && snapshot.val().password === p) {
                            localStorage.setItem("vc_launcher_loginuser", u); checkLoginState(); showToast("ログインしました");
                        } else { alert("ユーザー名かパスワードが間違っています"); }
                    });
                });
            };

            document.getElementById("inviteBtn").onclick = function() {
                navigator.clipboard.writeText(window.location.href).then(() => { showToast("招待URLをコピーしました！友達に送ってね"); });
            };

            document.getElementById("logoutBtn").onclick = function() {
                if(loginUser) { rooms.forEach(r => { if(r.users) { Object.keys(r.users).forEach(k => { if(r.users[k] === loginUser) delete r.users[k]; }); } }); dbRooms.set(rooms); }
                localStorage.removeItem("vc_launcher_loginuser"); checkLoginState();
            };

            document.getElementById("leaveBtn").onclick = () => {
                if(loginUser) { rooms.forEach(r => { if(r.users) { Object.keys(r.users).forEach(k => { if(r.users[k] === loginUser) delete r.users[k]; }); } }); dbRooms.set(rooms); showToast("退室しました"); }
            };

            document.getElementById("titleBtn").onclick = () => {
                const m = document.getElementById("settingsModal"); m.style.display = m.style.display === "block" ? "none" : "block";
            };

            document.getElementById("addBtn").onclick = () => {
                if(!isGodMode) return;
                const n = document.getElementById("name"), u = document.getElementById("url");
                if(!n.value || !u.value) return;
                
                const randomCode = generateRandomCode();
                rooms.push({name: n.value, url: u.value, code: randomCode, users: {}});
                
                dbRooms.set(rooms).then(() => {
                    alert(`部屋「${n.value}」を追加しました！\n招待コード: ${randomCode}`);
                    n.value = ""; u.value = "";
                });
            };

            document.getElementById("themeSelect").onchange = function() { config.theme = this.value; saveConfig(); };
            document.getElementById("animToggle").onchange = function() { config.anim = this.checked; saveConfig(); };
        };

        window.onbeforeunload = function() {
            if(loginUser) { rooms.forEach(r => { if(r.users) { Object.keys(r.users).forEach(k => { if(r.users[k] === loginUser) delete r.users[k]; }); } }); dbRooms.set(rooms); }
        };
    </script>
</body>
</html>
