<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン | VC Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo"><span class="dot"></span>VC Launcher</div>
      <div class="auth-sub" id="authSub">友達とだけの、小さなチャット+通話部屋。</div>

      <div class="auth-error" id="authError"></div>

      <form id="authForm">
        <div class="field">
          <label>ユーザー名</label>
          <input type="text" id="username" autocomplete="username" required maxlength="20">
        </div>
        <div class="field">
          <label>パスワード</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">ログイン</button>
      </form>

      <div class="auth-switch">
        <span id="switchText">アカウントを持っていない？</span>
        <button type="button" id="switchBtn">新規登録</button>
      </div>
    </div>
  </div>

  <script>
    let mode = 'login'; // or 'register'
    const form = document.getElementById('authForm');
    const errBox = document.getElementById('authError');
    const submitBtn = document.getElementById('submitBtn');
    const switchBtn = document.getElementById('switchBtn');
    const switchText = document.getElementById('switchText');
    const authSub = document.getElementById('authSub');

    switchBtn.addEventListener('click', () => {
      mode = mode === 'login' ? 'register' : 'login';
      if (mode === 'register') {
        submitBtn.textContent = '登録する';
        switchText.textContent = 'すでにアカウントを持っている？';
        switchBtn.textContent = 'ログイン';
        authSub.textContent = 'ユーザー名とパスワードだけで登録できます。';
      } else {
        submitBtn.textContent = 'ログイン';
        switchText.textContent = 'アカウントを持っていない？';
        switchBtn.textContent = '新規登録';
        authSub.textContent = '友達とだけの、小さなチャット+通話部屋。';
      }
      errBox.classList.remove('show');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`/api/${mode}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'エラーが発生しました');
        window.location.href = '/app.html';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.add('show');
      }
    });
  </script>
</body>
</html>
